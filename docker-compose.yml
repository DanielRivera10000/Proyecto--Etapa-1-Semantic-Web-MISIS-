# Fuseki para el Proyecto 1, entrega 2.
#
#   docker compose up -d          levanta el servidor
#   docker compose logs -f        mira el arranque
#   docker compose down           lo apaga y conserva los datos
#   docker compose down -v        lo apaga y borra los datos
#
# La interfaz queda en http://localhost:3030 con usuario admin y la contraseña

services:
  fuseki:
    image: stain/jena-fuseki:4.8.0
    container_name: music-fuseki
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: proyecto1      
      JVM_ARGS: -Xmx2g
    volumes:
      - fuseki-datos:/fuseki
    restart: unless-stopped

volumes:
  fuseki-datos: